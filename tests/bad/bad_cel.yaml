apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: bad-cel
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  validations:
    - expression: "object.metadata.labels.exists(k, k == 'team'"
      message: m
