# Errors behind matchConditions the load probe doesn't meet (#5): a
# mutation and a variable.
apiVersion: admissionregistration.k8s.io/v1alpha1
kind: MutatingAdmissionPolicy
metadata:
  name: map-match-conditions
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["deployments"]
  matchConditions:
    - name: deployments
      expression: 'object.kind == "Deployment"'
  variables:
    - name: tier
      expression: "tier"
  failurePolicy: Fail
  reinvocationPolicy: Never
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: "Object{metadata: Object.metadata{labels: objet.metadata.labels}}"
