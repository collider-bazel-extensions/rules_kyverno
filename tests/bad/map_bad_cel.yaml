kind: MutatingAdmissionPolicy
metadata:
  name: map-bad-cel
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["deployments"]
  failurePolicy: Fail
